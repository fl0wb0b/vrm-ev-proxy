services:
  vrm-ev-proxy:
    build: .
    image: ghcr.io/fl0wb0b/vrm-ev-proxy:latest
    container_name: vrm-ev-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - config:/config          # persists settings changed via web UI
    environment:
      - DATA_SOURCE=${DATA_SOURCE:-vrm}   # vrm or ble (Tesla over Bluetooth via TeslaBleHttpProxy)
      - BLE_URL=${BLE_URL:-}
      - BLE_VINS=${BLE_VINS:-}
      - VRM_TOKEN=${VRM_TOKEN}
      - VRM_SITE_ID=${VRM_SITE_ID}
      - POLL_INTERVAL=${POLL_INTERVAL:-60}
      - PORT=${PORT:-8080}
      - EVCC_URL=${EVCC_URL:-}     # e.g. http://192.168.1.10:7070; empty = evcc features off
      - TZ=${TZ:-Europe/Berlin}   # local time for status page dates ("today", timestamps)
    healthcheck:
      test: ["CMD", "python", "/app/app.py", "--healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  config:
